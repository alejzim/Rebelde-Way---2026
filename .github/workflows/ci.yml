name: Verificar proyecto

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Pruebas y compilación
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Preparar la versión de pnpm del proyecto
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Instalar dependencias del lockfile
        run: pnpm install --frozen-lockfile
      - name: Ejecutar pruebas y compilar
        run: pnpm check
